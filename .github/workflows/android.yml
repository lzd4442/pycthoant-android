name: Build Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_HOME: /opt/android-sdk
  ANDROID_SDK_ROOT: /opt/android-sdk

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Java 21
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openjdk-21-jdk > /dev/null 2>&1
          echo "JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64" >> $GITHUB_ENV

      - name: Download Android SDK cmdline-tools
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          curl -fsSL \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -o /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools/
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools \
             $ANDROID_HOME/cmdline-tools/latest

      - name: Accept licenses & install SDK components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            --sdk_root=$ANDROID_HOME \
            --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            --sdk_root=$ANDROID_HOME \
            "platforms;android-34" \
            "platforms;android-36" \
            "build-tools;34.0.0" \
            "build-tools;36.0.0"

      - name: Install npm dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set Gradle Properties (CI mode)
        run: |
          mkdir -p android
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> android/gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          echo "org.gradle.daemon=false" >> android/gradle.properties
          echo "org.gradle.parallel=false" >> android/gradle.properties

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Find APK
        id: find_apk
        run: |
          APK=$(find . -name "*.apk" -not -path "./build/*" | head -1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "APK: $APK"
          ls -lh "$APK"

      # ── 发布到 GitHub Release ─────────────────────────────────
      - name: Create or update Release
        id: release
        run: |
          # 提取当前 tag 名
          REF="${{ github.ref }}"
          if [[ "$REF" == refs/tags/* ]]; then
            TAG="${REF#refs/tags/}"
          else
            TAG="sha-${{ github.sha }}"
          fi

          # 先尝试查看 release 是否存在
          set +e
          gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1
          CODE=$?
          set -e

          if [ $CODE -eq 0 ]; then
            echo "release_tag=$TAG" >> $GITHUB_OUTPUT
            echo "release_exists=true" >> $GITHUB_OUTPUT
          else
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "Pycthoant Android $TAG" \
              --notes "🤖 自动构建版本"
            echo "release_tag=$TAG" >> $GITHUB_OUTPUT
            echo "release_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload APK to Release
        run: |
          TAG="${{ steps.release.outputs.release_tag }}"
          APK="${{ steps.find_apk.outputs.apk_path }}"
          echo "Uploading $(basename $APK) to release $TAG..."
          gh release upload "$TAG" "$APK" \
            --repo "${{ github.repository }}" \
            --clobber

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: pycthoant-android-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30
