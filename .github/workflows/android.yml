name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # ── 检测 / 安装缺失的 Android SDK 组件 ─────────────────
      - name: Install Android SDK components
        run: |
          # ubuntu-latest 自带 ANDROID_HOME=/home/runner/android-sdk
          export ANDROID_HOME="${ANDROID_HOME:-/home/runner/android-sdk}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          # 检查是否需要安装 platforms;android-36
          if [ -d "$ANDROID_HOME/platforms/android-36" ]; then
            echo "SDK 36 already installed"
          else
            echo "Installing Android SDK 36..."
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -fsSL \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
              -o /tmp/cmdline-tools.zip
            unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools/"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" \
               "$ANDROID_HOME/cmdline-tools/latest"
            yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
              "platforms;android-34" \
              "platforms;android-36" \
              "build-tools;34.0.0" \
              "build-tools;36.0.0"
          fi

      - name: Install npm dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set Gradle Properties (CI mode)
        run: |
          mkdir -p android
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> android/gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          echo "org.gradle.daemon=false" >> android/gradle.properties
          echo "org.gradle.parallel=false" >> android/gradle.properties

      - name: Build APK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/home/runner/android-sdk}"
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Find APK
        id: find_apk
        run: |
          APK=$(find . -name "*.apk" -not -path "./build/*" | head -1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "APK file: $APK"
          ls -lh "$APK"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: pycthoant-android-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK="${{ steps.find_apk.outputs.apk_path }}"
          gh release upload "${{ github.ref_name }}" "$APK" \
            --clobber \
            --repo "${{ github.repository }}"
