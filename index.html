<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Pycthoant 下载器</title>
    <link rel="icon" type="image/svg+xml" href="/cat.svg" />
  </head>
  <body>
    <div id="app">
      <!-- 顶部标题栏 -->
      <header>
        <div class="logo-row">
          <div class="cat-icon">🐱</div>
          <div class="title-block">
            <h1>Pycthoant</h1>
            <p class="subtitle">喵化你的 Python 输出</p>
          </div>
        </div>
      </header>

      <!-- 版本卡片 -->
      <section id="version-card">
        <div class="card-inner">
          <div class="card-row">
            <span class="label">最新版本</span>
            <span id="latest-version" class="value">检测中…</span>
          </div>
          <div class="card-row">
            <span class="label">发布时间</span>
            <span id="release-date" class="value">—</span>
          </div>
          <div class="card-row">
            <span class="label">文件大小</span>
            <span id="file-size" class="value">—</span>
          </div>
          <div class="card-row">
            <span class="label">发布时间</span>
            <span id="status" class="value status-idle">点击下方按钮下载安装</span>
          </div>
        </div>
      </section>

      <!-- 下载按钮 -->
      <section id="action-area">
        <button id="download-btn" class="btn-download">
          <span class="btn-icon">⬇️</span>
          <span class="btn-text">下载安装 APK</span>
        </button>
        <p class="hint">大小约 20 MB，支持 Android 7.0+</p>
      </section>

      <!-- 进度条（隐藏） -->
      <section id="progress-section" class="hidden">
        <div class="progress-info">
          <span id="progress-label">正在下载…</span>
          <span id="progress-pct">0%</span>
        </div>
        <div class="progress-bar-wrap">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
        <p id="progress-detail" class="progress-detail"></p>
      </section>

      <!-- 完成提示（隐藏） -->
      <section id="done-section" class="hidden">
        <div class="done-icon">✅</div>
        <p class="done-text">下载完成！</p>
        <p class="done-hint">请点击上方通知栏安装，或打开文件管理器找到 APK 点击安装。</p>
        <p class="done-hint warn">⚠️ 若提示"安装来源未知"，请先开启：设置 → 安全 → 允许未知来源应用</p>
        <button id="reinstall-btn" class="btn-secondary">重新下载</button>
      </section>

      <!-- 错误提示（隐藏） -->
      <section id="error-section" class="hidden">
        <div class="error-icon">❌</div>
        <p id="error-text" class="error-text">下载失败</p>
        <button id="retry-btn" class="btn-secondary">重试</button>
      </section>

      <!-- 底部说明 -->
      <footer>
        <p>项目地址：<a href="https://github.com/lzd4442/pycthoant" target="_blank">github.com/lzd4442/pycthoant</a></p>
        <p class="footer-note">安卓版 by Copilot ⚡</p>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
